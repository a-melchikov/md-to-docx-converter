services:
  api-dev:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
      target: dev
    environment:
      NODE_ENV: development
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8080}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-debug}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost,http://localhost:5173}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-100}
      API_RATE_LIMIT_TIME_WINDOW: ${API_RATE_LIMIT_TIME_WINDOW:-1 minute}
      API_MULTIPART_FILE_SIZE_LIMIT_BYTES: ${API_MULTIPART_FILE_SIZE_LIMIT_BYTES:-10485760}
      API_MULTIPART_MAX_FILES: ${API_MULTIPART_MAX_FILES:-4}
      API_MULTIPART_MAX_FIELDS: ${API_MULTIPART_MAX_FIELDS:-32}
    expose:
      - "8080"
    volumes:
      - ./apps/api/src:/workspace/apps/api/src
      - ./packages/domain/src:/workspace/packages/domain/src
      - ./packages/config-schema/src:/workspace/packages/config-schema/src
      - ./packages/md-parser/src:/workspace/packages/md-parser/src
      - ./packages/style-engine/src:/workspace/packages/style-engine/src
      - ./packages/docx-adapter/src:/workspace/packages/docx-adapter/src
      - ./packages/html-preview/src:/workspace/packages/html-preview/src
      - api_dev_tmp:/tmp/md-to-docx
    networks:
      default:
        aliases:
          - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web-dev:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      target: dev
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    expose:
      - "80"
    volumes:
      - ./apps/web/src:/workspace/apps/web/src
      - ./apps/web/index.html:/workspace/apps/web/index.html
      - ./apps/web/vite.config.ts:/workspace/apps/web/vite.config.ts
      - ./packages/domain/src:/workspace/packages/domain/src
      - ./packages/config-schema/src:/workspace/packages/config-schema/src
    networks:
      default:
        aliases:
          - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx-dev:
    image: nginx:1.27-alpine
    depends_on:
      api-dev:
        condition: service_healthy
      web-dev:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  api_dev_tmp:
