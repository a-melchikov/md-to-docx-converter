services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
      target: runtime
    environment:
      NODE_ENV: production
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8080}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-100}
      API_RATE_LIMIT_TIME_WINDOW: ${API_RATE_LIMIT_TIME_WINDOW:-1 minute}
      API_MULTIPART_FILE_SIZE_LIMIT_BYTES: ${API_MULTIPART_FILE_SIZE_LIMIT_BYTES:-10485760}
      API_MULTIPART_MAX_FILES: ${API_MULTIPART_MAX_FILES:-4}
      API_MULTIPART_MAX_FIELDS: ${API_MULTIPART_MAX_FIELDS:-32}
    expose:
      - "8080"
    volumes:
      - api_tmp:/tmp/md-to-docx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      target: runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  api_tmp:
